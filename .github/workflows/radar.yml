name: Job Radar

on:
  # PRIMARY: Supabase pg_cron pokes this every 5 minutes via the GitHub API.
  # repository_dispatch is an EVENT trigger - the same lane as `push`, which
  # fires immediately. `schedule` sits in a throttled best-effort queue and
  # was measured on this repo delivering only 4% of requested runs.
  repository_dispatch:
    types: [poll]

  # FALLBACK: if the dispatch chain ever breaks, this still catches new jobs
  # eventually. Shared Supabase state means it can never double-alert.
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: read      # state lives in Supabase now - nothing is committed

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll Cisco and alert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set"
            exit 1
          fi
          echo "Triggered by: ${{ github.event_name }}"
          python -m src poll
